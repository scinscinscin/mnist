<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MNIST Digit Predictor</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: system-ui, sans-serif;
        background: #14161a;
        color: #e6e6e6;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      .app {
        display: flex;
        gap: 32px;
        align-items: stretch;
      }
      .panel {
        background: #1e2128;
        border: 1px solid #2c313a;
        border-radius: 12px;
        padding: 20px;
      }
      .panel h2 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9aa4b2;
        margin: 0 0 14px;
      }
      #canvas {
        width: 280px;
        height: 280px;
        border-radius: 8px;
        background: #000;
        image-rendering: pixelated;
        cursor: crosshair;
        touch-action: none;
      }
      .controls {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        background: #2c313a;
        color: #e6e6e6;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        background: #3a4150;
      }
      .predictions {
        width: 320px;
      }
      #predicted {
        font-size: 64px;
        font-weight: 700;
        line-height: 1;
        margin-bottom: 18px;
      }
      .bar-row {
        display: grid;
        grid-template-columns: 20px 1fr 48px;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        font-size: 14px;
      }
      .bar {
        height: 10px;
        background: #2c313a;
        border-radius: 5px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: #4f8cff;
        border-radius: 5px;
        transition: width 0.05s linear;
      }
      .bar-row.top .bar-fill {
        background: #3ddc84;
      }
      .pct {
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: #9aa4b2;
      }
      .hint {
        color: #6b7280;
        font-size: 13px;
        margin-top: 12px;
      }
      #error {
        color: #ff6b6b;
        font-size: 14px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>MNIST Digit Predictor</h1>
    <div class="app">
      <div class="panel">
        <h2>Draw a digit</h2>
        <canvas id="canvas" width="28" height="28"></canvas>
        <div class="controls">
          <button id="clear">Clear</button>
        </div>
      </div>
      <div class="panel predictions">
        <h2>Predictions</h2>
        <div id="error">
          Could not load weights128.json. Serve this file over HTTP, e.g. <code>python3 -m http.server</code> in the
          project folder.
        </div>
        <div id="predicted">?</div>
        <div id="bars"></div>
        <div class="hint">Draw in white, like MNIST.</div>
      </div>
    </div>
    <script>
      const SIZE = 28;

      // ---- network (mirrors src/network.ts) ----
      let layers = null; // array of { rows, cols, data }, data is rows x cols, last row = biases

      const sigmoid = (x) => 1 / (1 + Math.exp(-x));

      function softmax(arr) {
        const max = Math.max(...arr);
        const exps = arr.map((v) => Math.exp(v - max));
        const sum = exps.reduce((a, b) => a + b, 0);
        return exps.map((v) => v / sum);
      }

      // input: number[784] row-major 28x28, values in [0, 1]
      function forward(input) {
        let x = input;
        for (let l = 0; l < layers.length; l++) {
          const m = layers[l].data; // rows = x.length + 1, cols = output size
          const out = new Array(m[0].length);
          for (let j = 0; j < m[0].length; j++) {
            let sum = m[m.length - 1][j]; // bias (final row)
            for (let i = 0; i < x.length; i++) sum += x[i] * m[i][j];
            out[j] = sum;
          }
          x = l === layers.length - 1 ? softmax(out) : out.map(sigmoid);
        }
        return x;
      }

      // ---- canvas ----
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const barsEl = document.getElementById("bars");
      const predictedEl = document.getElementById("predicted");

      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, SIZE, SIZE);

      function drawBarRows(probs) {
        if (!barsEl.childElementCount) {
          for (let i = 0; i < 10; i++) {
            const row = document.createElement("div");
            row.className = "bar-row";
            row.innerHTML = `<span>${i}</span><div class="bar"><div class="bar-fill" style="width:0%"></div></div><span class="pct">0.0%</span>`;
            barsEl.appendChild(row);
          }
        }
        const top = probs.indexOf(Math.max(...probs));
        const rows = barsEl.children;
        for (let i = 0; i < 10; i++) {
          rows[i].classList.toggle("top", i === top);
          rows[i].querySelector(".bar-fill").style.width = (probs[i] * 100).toFixed(1) + "%";
          rows[i].querySelector(".pct").textContent = (probs[i] * 100).toFixed(1) + "%";
        }
        predictedEl.textContent = top;
      }

      function update() {
        if (!layers) return;
        const img = ctx.getImageData(0, 0, SIZE, SIZE).data;
        const input = new Array(SIZE * SIZE);
        for (let i = 0; i < SIZE * SIZE; i++) input[i] = img[i * 4] / 255; // R channel, row-major
        drawBarRows(forward(input));
      }

      // ---- painting ----
      let painting = false;
      const BRUSH = 0.5; // pixels

      function paint(e) {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor(((e.clientX - rect.left) / rect.width) * SIZE);
        const y = Math.floor(((e.clientY - rect.top) / rect.height) * SIZE);
        ctx.fillStyle = "#fff";
        for (let dy = -BRUSH; dy <= BRUSH; dy++)
          for (let dx = -BRUSH; dx <= BRUSH; dx++) {
            const px = x + dx,
              py = y + dy;
            if (px >= 0 && px < SIZE && py >= 0 && py < SIZE) ctx.fillRect(px, py, 1, 1);
          }

        update();
      }

      canvas.addEventListener("pointerdown", (e) => {
        painting = true;
        canvas.setPointerCapture(e.pointerId);
        paint(e);
      });
      canvas.addEventListener("pointermove", (e) => {
        if (painting) paint(e);
      });
      canvas.addEventListener("pointerup", () => {
        painting = false;
      });

      document.getElementById("clear").addEventListener("click", () => {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, SIZE, SIZE);
        update();
      });

      // ---- load weights ----
      fetch("weights64.json")
        .then((r) => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then((d) => {
          layers = d.layers;
          update();
        })
        .catch(() => {
          document.getElementById("error").style.display = "block";
        });
    </script>
  </body>
</html>
